name: Release
on:
  push:
    branches: ['release/*']
  pull_request:
    types: [closed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-run-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      (github.event_name == 'push' && !github.event.deleted) ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      commit: ${{ steps.meta.outputs.commit }}
      version: ${{ steps.meta.outputs.version }}
      artifactName: ${{ steps.meta.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: meta
        uses: SokuRitszZ/npm-release-action@e1b36cdc957a8f08311be813998e3d5f3f00edf4
        with:
          phase: plan
          working-directory: '.'
          release-branch-prefix: 'release/'
          main-branch: main
          prerelease-id: beta
          prerelease-tag: beta
          stable-tag: latest
          tag-prefix: v
          registry-url: 'https://registry.npmjs.org/'
          access: public
          shrinkwrap: 'true'
          source-archive: 'true'
          dry-run: 'true'
      - if: vars.NPM_PUBLISH_ENABLED != 'true'
        run: echo '::notice::Publication is disabled. Configure npm trusted publisher and set NPM_PUBLISH_ENABLED=true to enable npm and GitHub Release.'
  verify:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}
  build:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PI_OFFLINE: '1'
      PI_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm install --global npm@11.12.1 --ignore-scripts
      - run: npm ci --ignore-scripts
      - id: bundle
        uses: SokuRitszZ/npm-release-action@e1b36cdc957a8f08311be813998e3d5f3f00edf4
        with:
          phase: build
          version: ${{ needs.prepare.outputs.version }}
          working-directory: '.'
          release-branch-prefix: 'release/'
          main-branch: main
          prerelease-id: beta
          prerelease-tag: beta
          stable-tag: latest
          tag-prefix: v
          registry-url: 'https://registry.npmjs.org/'
          access: public
          shrinkwrap: 'true'
          source-archive: 'true'
          dry-run: 'true'
      - name: Smoke test the exact npm artifact (no repack)
        env:
          NPM_ARTIFACT: ${{ steps.bundle.outputs.npm-file }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: npm run smoke:npm -- --artifact "$NPM_ARTIFACT" --expected-version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifactName }}
          path: ${{ steps.bundle.outputs.artifact-directory }}
          if-no-files-found: error
          retention-days: 30
  publish-npm:
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: npm install --global npm@11.12.1 --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifactName }}
          path: ${{ runner.temp }}/npm-release
      - uses: SokuRitszZ/npm-release-action@e1b36cdc957a8f08311be813998e3d5f3f00edf4
        with:
          phase: publish-npm
          version: ${{ needs.prepare.outputs.version }}
          working-directory: '.'
          release-branch-prefix: 'release/'
          main-branch: main
          prerelease-id: beta
          prerelease-tag: beta
          stable-tag: latest
          tag-prefix: v
          registry-url: 'https://registry.npmjs.org/'
          access: public
          shrinkwrap: 'true'
          source-archive: 'true'
          dry-run: 'false'
  github-release:
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    needs: [prepare, build, publish-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: npm install --global npm@11.12.1 --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifactName }}
          path: ${{ runner.temp }}/npm-release
      - uses: SokuRitszZ/npm-release-action@e1b36cdc957a8f08311be813998e3d5f3f00edf4
        with:
          phase: publish-github
          version: ${{ needs.prepare.outputs.version }}
          working-directory: '.'
          release-branch-prefix: 'release/'
          main-branch: main
          prerelease-id: beta
          prerelease-tag: beta
          stable-tag: latest
          tag-prefix: v
          registry-url: 'https://registry.npmjs.org/'
          access: public
          shrinkwrap: 'true'
          source-archive: 'true'
          dry-run: 'false'
          github-token: ${{ github.token }}
