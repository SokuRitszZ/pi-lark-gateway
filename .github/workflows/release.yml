name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release or retry (e.g. v1.0.0-rc.2)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      commit: ${{ steps.meta.outputs.commit }}
      version: ${{ steps.meta.outputs.version }}
      artifactName: ${{ steps.meta.outputs.artifactName }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - id: meta
        run: node scripts/ci-release.js metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      - if: vars.NPM_PUBLISH_ENABLED != 'true'
        run: echo '::notice::Publication is disabled. Configure npm trusted publisher and set NPM_PUBLISH_ENABLED=true to enable npm and GitHub Release.'
  verify:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}
  build:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      PI_OFFLINE: '1'
      PI_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm install --global npm@11.12.1 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: node scripts/release.js
      - run: node scripts/npm-release.js
      - run: node scripts/ci-release.js verify
      - name: Smoke test the exact npm artifact (no repack)
        run: npm run smoke:npm -- --artifact "dist/npm/pi-lark-gateway-${RELEASE_VERSION}.tgz"
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifactName }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/npm/*.tgz
            dist/npm/*.sha256
          if-no-files-found: error
          retention-days: 30
  publish-npm:
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      NPM_PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: npm install --global npm@11.12.1 --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifactName }}
          path: dist
      - run: node scripts/publish-npm.js
  github-release:
    needs: [prepare, build, publish-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifactName }}
          path: dist
      - uses: actions/github-script@v7
        with:
          script: |
            try {
              const { pathToFileURL } = require('node:url');
              const module = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/github-release.js`).href);
              await module.runGitHubRelease({ github, context });
            } catch {
              core.setFailed('GitHub Release failed: check tag, artifact integrity and existing immutable assets. Re-run failed jobs with the original artifact; do not clobber assets.');
            }
