name: Release
on:
  push:
    branches: ['release/*']
  pull_request:
    types: [closed]
    branches: [main]
permissions:
  contents: read
concurrency:
  # Distinct pushes must not replace pending runs in GitHub's concurrency queue.
  group: release-run-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      (github.event_name == 'push' && !github.event.deleted) ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      commit: ${{ steps.meta.outputs.commit }}
      version: ${{ steps.meta.outputs.version }}
      artifactName: ${{ steps.meta.outputs.artifactName }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - id: meta
        run: node scripts/ci-release.js metadata
      - if: vars.NPM_PUBLISH_ENABLED != 'true'
        run: echo '::notice::Publication is disabled. Configure npm trusted publisher and set NPM_PUBLISH_ENABLED=true to enable npm and GitHub Release.'
  verify:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}
  build:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      PI_OFFLINE: '1'
      PI_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm install --global npm@11.12.1 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: node scripts/ci-release.js build
      - name: Smoke test the exact npm artifact (no repack)
        run: npm run smoke:npm -- --artifact "dist/npm/pi-lark-gateway-${RELEASE_VERSION}.tgz" --expected-version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifactName }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/npm/*.tgz
            dist/npm/*.sha256
          if-no-files-found: error
          retention-days: 30
  publish-npm:
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      NPM_PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: npm install --global npm@11.12.1 --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifactName }}
          path: dist
      - run: node scripts/publish-npm.js
  github-release:
    needs: [prepare, build, publish-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifactName }}
          path: dist
      - uses: actions/github-script@v7
        with:
          script: |
            try {
              const { pathToFileURL } = require('node:url');
              const module = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/github-release.js`).href);
              await module.runGitHubRelease({ github, context });
            } catch {
              core.setFailed('GitHub Release failed: check event/version plan, artifact integrity and existing immutable assets. Re-run failed jobs with the original artifact; do not clobber assets.');
            }
